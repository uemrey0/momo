name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug. Please search existing issues first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Momo menu
        2. Choose ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Momo version or commit
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 26.1, MacBook Pro 14-inch (M3)
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, recordings or logs
