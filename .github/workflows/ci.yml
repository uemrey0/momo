name: CI

# Pull requests run CI only once a maintainer approves them by adding the "ci: run" label
# (only people with triage access can add labels), so every push to every branch doesn't
# spend macOS runner time. Pushes to main always run; any branch can also be run by hand
# from the Actions tab. After approval, later pushes to the pull request run again.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Adding another label must not cancel a run in progress, so those events get their own
  # group (their jobs are skipped anyway).
  group: >-
    ci-${{ github.ref }}-${{
      github.event.action == 'labeled' && github.event.label.name != 'ci: run'
      && github.run_id || 'run' }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    if: >-
      github.event_name != 'pull_request'
      || (github.event.action == 'labeled' && github.event.label.name == 'ci: run')
      || (github.event.action != 'labeled'
          && contains(github.event.pull_request.labels.*.name, 'ci: run'))
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "XCODE_VERSION=$(xcodebuild -version | tr -cs 'A-Za-z0-9.' '-')" >> "$GITHUB_ENV"

      - name: Cache build products
        # Keyed on the Xcode version too, since products from another compiler don't mix.
        uses: actions/cache@v6
        with:
          path: .build
          key: >-
            build-${{ env.XCODE_VERSION }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{
            hashFiles('Sources/**', 'Tests/**') }}
          restore-keys: |
            build-${{ env.XCODE_VERSION }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-

      - name: Check formatting
        run: make lint

      - name: Check translations
        run: make l10n

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build app bundle
        # The voice-helper job below builds and tests the helper, so it isn't built twice.
        env:
          VOICE_HELPER: 0
        run: make app

  voice-helper:
    name: Build and test the voice helper
    # The helper needs the macOS 15 SDK (Xcode 16 or later) and Apple Silicon for MLX.
    if: >-
      github.event_name != 'pull_request'
      || (github.event.action == 'labeled' && github.event.label.name == 'ci: run')
      || (github.event.action != 'labeled'
          && contains(github.event.pull_request.labels.*.name, 'ci: run'))
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install the Metal toolchain
        # MLX compiles its Metal shaders at build time.
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Cache Swift packages
        uses: actions/cache@v6
        with:
          path: .build/voice-helper/SourcePackages
          key: voice-helper-${{ hashFiles('Helpers/momo-voice/Package.resolved') }}

      - name: Build
        run: make voice-helper

      - name: Test
        run: make voice-helper-test

      - name: Run
        run: .build/voice-helper/Build/Products/Release/momo-voice --list-models tr-TR
